name: Optional engineering adapters
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHON: python
      PYTHONUTF8: '1'
      ENGINEER_OS_CALCULATION_CHILD_SMOKE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional isolated-job dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-bim.txt -r requirements-calculation.txt -r requirements-cad.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Check IFC, CAD roundtrip and analytical benchmark
        run: python -m unittest tests.test_cad_worker tests.test_local_normative_catalog tests.test_ifc_worker_limits tests.test_ifc_jobs_complete tests.test_ifc_evidence_ui tests.test_ifc_spatial_containment tests.test_engineering_jobs tests.test_engineering_verification tests.test_engineering_verification_http tests.test_ifc_adapter tests.test_ifc_geometry_completion tests.test_control_beam tests.test_planar_control tests.test_section_control tests.test_engineering_tools_cli tests.test_cad_roundtrip_comparison tests.test_cad_conversion_route tests.test_docling_runtime_losses tests.test_normative_rule_registry tests.test_normative_catalog tests.test_source_corpus_audit -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install locked browser dependencies
        run: npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
      - name: Prepare Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Check calculation, IFC declaration and responsible review workflows
        run: npm run test:engineering --prefix e2e
