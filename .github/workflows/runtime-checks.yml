name: ENGINEER OS runtime checks

on:
  push:
    branches:
      - architecture/runtime-integration
  pull_request:
    branches:
      - main
      - architecture/runtime-integration

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ENGINEER OS unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  codex-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Codex CLI
        run: npm install -g @openai/codex
      - name: Verify Codex App Server binary
        run: |
          set -e
          command -v codex
          codex --version
          codex app-server --help
      - name: Run live Codex App Server transport smoke
        run: python tests/codex_app_server_smoke.py
