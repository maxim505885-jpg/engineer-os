name: ENGINEER OS Core Tests

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile runtime
        run: python -m compileall -q engineering runtime e2e
