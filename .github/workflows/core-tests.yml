name: ENGINEER OS Core Tests

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
      - "integration/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check engineering/local_app/ui/app.js
          node --check engineering/local_app/ui/cad-memory.js
      - name: Check dashboard behavior
        run: node --test tests/dashboard_counts.test.cjs
      - name: Check architecture boundaries
        run: python scripts/architecture_guard.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned regression dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Install locked development-only DOM dependencies
        run: npm ci --prefix e2e --ignore-scripts --no-audit --no-fund
      - name: Install local OCR regression models
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng fonts-dejavu-core
      - name: Install locked Playwright Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Check Windows launcher PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @("scripts/windows_supervisor.ps1","scripts/windows_stop.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_ }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Check Stage12 backup restore and recovery
        run: python -m unittest tests.test_local_backup_restore -v
      - name: Run full Python regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile runtime
        run: python -m compileall -q engineering runtime e2e scripts
      - name: Check actual local HTTP and DOM workflows
        env:
          PYTHON: python
          ENGINEER_OS_ATTACHMENT_PARSER: native
        run: npm test --prefix e2e
      - name: Check real Chromium local UI workflow
        env:
          PYTHON: python
          ENGINEER_OS_ATTACHMENT_PARSER: native
          ENGINEER_OS_UI_SCREENSHOT_DIR: e2e/.artifacts/stage11
        run: npm run test:browser --prefix e2e
      - name: Upload Chromium UI reference screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineer-os-ui-reference-${{ github.run_id }}
          path: e2e/.artifacts/stage11/
          retention-days: 30
          if-no-files-found: warn
